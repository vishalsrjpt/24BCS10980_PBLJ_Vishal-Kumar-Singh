server:
  port: ${PORT:8081}
  servlet:
    context-path: /

spring:
  application:
    name: campusfind-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:projdb}?currentSchema=campusfind
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:753210}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: campusfind
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: false
  flyway:
    enabled: true
    schemas: campusfind
    default-schema: campusfind
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

campusfind:
  jwt:
    secret: ${JWT_SECRET:CampusFindSecretKeyForJwtAuthenticationSuperSecure384BitStringHere!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
  superadmin:
    email: ${SUPERADMIN_EMAIL:admin@gmail.com}
    password: ${SUPERADMIN_PASSWORD:admin123}
    name: ${SUPERADMIN_NAME:System Super Admin}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
