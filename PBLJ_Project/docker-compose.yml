version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campusfind-postgres
    restart: always
    environment:
      POSTGRES_DB: projdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-753210}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata:
